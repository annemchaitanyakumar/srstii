    :root {
      --ink: #1c1a1f;
      --cream: #f0e8e0;
      --dark: #191a1e;
      --flav: #D49B3E;
      --g: rgba(212, 155, 62, 0.72);
      --rv: transparent;
      --ease: cubic-bezier(.22, .8, .24, 1);
      --glide: cubic-bezier(.25, .75, .2, 1);
      --sheet: url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261116_132032_30242d8c-5062-4d60-8a3d-238f0a2ff788.png&w=2200&q=85");
      --u: min(100vw / 1440, 100vh / 900);
      --w: calc(100vw / 1440);
      --n: min(100vw / 1440, 1px);
      --frame-k: 1;
    }

    @media (max-width: 819px) {
      :root {
        --u: min(100vw / 560, 100svh / 980);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: auto;
      background: var(--cream);
      color: var(--ink);
      font-family: 'EB Garamond', Garamond, Georgia, serif;
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      overflow-x: hidden;
      background: var(--cream);
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    body.locked {
      overflow: hidden !important;
      height: 100vh !important;
    }

    body.dragging {
      cursor: grabbing !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    .disp {
      font-family: 'EB Garamond', Garamond, Georgia, serif;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 0.92;
    }

    /* Sprite helper */
    .spr {
      background-image: var(--sheet);
      background-repeat: no-repeat;
    }

    /* Wrapper crops (pad = 4) */
    .spr-wrap-0 {
      background-size: 654.0146% 177.3629%;
      background-position: 4.1282% 21.2670%;
    }

    .spr-wrap-1 {
      background-size: 655.6098% 177.3629%;
      background-position: 27.0413% 21.2670%;
    }

    .spr-wrap-2 {
      background-size: 655.6098% 177.3629%;
      background-position: 49.7366% 21.2670%;
    }

    .spr-wrap-3 {
      background-size: 655.6098% 177.3629%;
      background-position: 72.7392% 21.2670%;
    }

    .spr-wrap-4 {
      background-size: 654.0146% 177.3629%;
      background-position: 95.7400% 21.2670%;
    }

    /* 3D Botanical Oil Ingredient Floating Bits */
    .hero-bit,
    .storm-piece {
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.42)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.22));
    }

    /* Fixed WebGL canvas (z-index: 2, pointer-events: none) */
    #gl {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* TOP RIGHT CART MODULE (#nav) */
    #nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(94 * var(--n));
      padding: 0 calc(37 * var(--n)) 0 calc(42 * var(--n));
      display: flex;
      align-items: center;
      justify-content: flex-end;
      z-index: 50;
      color: var(--ink);
      pointer-events: none;
    }

    #nav.dark {
      color: var(--cream);
    }

    .nav-right {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: calc(12 * var(--n));
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: calc(14 * var(--n));
    }

    .brand-mark {
      width: calc(36 * var(--n));
      height: calc(36 * var(--n));
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 300ms ease;
    }

    .brand-mark svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .mark-circle {
      fill: var(--ink);
      transition: fill 300ms ease;
    }

    .mark-path {
      fill: var(--cream);
      transition: fill 300ms ease;
    }

    #nav.dark .mark-circle {
      fill: var(--cream);
    }

    #nav.dark .mark-path {
      fill: var(--dark);
    }

    .brand-name {
      font-family: 'EB Garamond', Garamond, Georgia, serif;
      font-weight: 800;
      font-size: calc(15.5 * var(--n));
      letter-spacing: 0.06em;
    }

    .nav-centre {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .nav-pill {
      position: relative;
      display: flex;
      align-items: center;
      gap: 2px;

      top: calc(5 * var(--n));

      color: inherit;
      text-decoration: none;

      color: var(--ink);

    .nav-right {

      align-items: center;

    .nav-chip {

      align-items: center;
      justify-content: center;
      padding: 0 calc(16 * var(--n));

      text-decoration: none;

    }

    .basket-chip {
      width: calc(44 * var(--n));

      position: relative;
    }

    .basket-chip svg {
      width: calc(18 * var(--n));
      height: calc(18 * var(--n));
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--ink);
      color: #ffffff;
      font-family: 'EB Garamond', Garamond, Georgia, serif;
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1;

      border-radius: 9999px;

      align-items: center;
      justify-content: center;

    }

    @keyframes badgePop {
      0% {
        transform: scale(0);

      60% {
        transform: scale(1.5);
      }

      100% {
        transform: scale(1);
      }
    }

    .dibs-btn {
      height: calc(37 * var(--n));
      padding: 0 calc(20 * var(--n));
      border-radius: 9999px;
      font-family: 'EB Garamond', Garamond, Georgia, serif;
      font-size: calc(14.5 * var(--n));
      font-weight: 600;

      color: var(--cream);

      transition: background 300ms ease, color 300ms ease, transform 200ms ease;

    .dibs-btn:hover {
      transform: translateY(-1px);

    #nav.dark .dibs-btn {
      background: #8fa8a3;
      color: var(--ink);

    /* SECTION 1: HERO */
    .hero-sec {

      background: var(--flav);

    }

    .reveal {
      position: absolute;
      inset: 0;
      background: var(--rv, transparent);
      pointer-events: none;
      z-index: 0;
    }

    .rings {
      position: absolute;
      top: 41%;
      left: 50%;
      width: calc(2200 * var(--u));
      height: calc(2200 * var(--u));
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      background: repeating-radial-gradient(circle, rgba(255, 255, 255, .13) 0, rgba(255, 255, 255, .02) calc(40 * var(--u)), rgba(255, 255, 255, .13) calc(80 * var(--u)));
      mask-image: radial-gradient(circle, #000 0 22%, rgba(0, 0, 0, .55) 34%, transparent 52%);
      -webkit-mask-image: radial-gradient(circle, #000 0 22%, rgba(0, 0, 0, .55) 34%, transparent 52%);
      transition: transform 1100ms ease-out, opacity 1100ms ease-out;
    }

    .rings.entered {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .hero-spotlight {
      position: absolute;
      left: 50%;
      top: 52%;
      width: calc(560 * var(--u));
      height: calc(180 * var(--u));
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.45) 0%, var(--g, rgba(212, 155, 62, 0.35)) 42%, transparent 72%);
      filter: blur(18px);
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen;
      opacity: 0.9;
      transition: opacity 600ms ease, background 500ms ease;
    }

    .bits {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .hero-bit {
      position: absolute;
      opacity: 0;
      transition: opacity 700ms ease-out, transform 500ms ease-out;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.32));
    }

    .hero-bit.bit-0 {
      left: 12%;
      top: 20%;
      width: calc(120 * var(--u));
      height: calc(108 * var(--u));
    }

    .hero-bit.bit-1 {
      left: 20.5%;
      top: 88.5%;
      width: calc(70 * var(--u));
      height: calc(64 * var(--u));
    }

    .hero-bit.bit-2 {
      left: 86%;
      top: 18%;
      width: calc(96 * var(--u));
      height: calc(85 * var(--u));
    }

    .hero-bit.bit-3 {
      left: 7%;
      top: 74%;
      width: calc(84 * var(--u));
      height: calc(67 * var(--u));
    }

    .hero-bit.bit-4 {
      left: 65.5%;
      top: 15%;
      width: calc(78 * var(--u));
      height: calc(92 * var(--u));
    }

    .arc {
      position: absolute;
      inset: 0;
      touch-action: pan-y;
      z-index: 10;
      cursor: grab;
    }

    .hero-title {
      position: absolute;
      top: calc(50% + 265 * var(--u));
      left: 50%;
      transform: translateX(-50%);
      font-size: calc(96 * var(--u));

      z-index: 60;
      pointer-events: none;
      line-height: 0.92;

    .hero-title .word {
      display: inline-block;
      white-space: nowrap;
      vertical-align: top;
      overflow: hidden;
    }

    .hero-title .char {
      display: inline-block;
      will-change: transform, opacity;
    }

    .hero-count {
      position: absolute;
      top: calc(50% + 215 * var(--u));
      right: calc(50vw - 720 * var(--u) + 28 * var(--u));
      font-size: calc(200 * var(--u));
      line-height: 0.8;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.9);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 600ms ease-out 620ms, transform 380ms cubic-bezier(.22, 1, .36, 1);
    }

    .hero-count.entered {
      opacity: 1;
    }

    .hero-next {
      position: absolute;
      top: calc(50% + 200 * var(--u));
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(52 * var(--u));
      height: calc(52 * var(--u));
      border-radius: 50%;
      background: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(40, 28, 60, 0.12);
      z-index: 60;
      opacity: 0;
      transition: opacity 600ms ease-out 500ms, transform 200ms ease, box-shadow 200ms ease;
    }

    .hero-next.entered {
      opacity: 1;
    }

    .hero-next:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    .hero-next:active {
      transform: translate(-50%, -50%) scale(0.94);
    }

    .hero-next svg {
      width: calc(18 * var(--u));
      height: calc(18 * var(--u));
      stroke: var(--ink);
      transition: transform 200ms ease;
    }

    .hero-next:hover svg {
      transform: translateX(2px);
    }

    .hero-auto {
      position: absolute;
      top: calc(50% + 170 * var(--u));
      right: calc(50vw - 720 * var(--u) + 40 * var(--u));

      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 60;
      opacity: 0;

    .hero-auto.entered {

    .auto-ring {

    /* SECTION 3: SHOP */
    .shop-sec {
      position: relative;
      background: var(--cream);
      padding: calc(96 * var(--w)) calc(39 * var(--w)) calc(80 * var(--w));

    .line-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;

    .line-inner {

      transform: translateY(105%);

    .shop-head.revealed .line-inner {

    .shop-cap {

    .shop-cap.revealed {

    .shop-grid {
      display: grid;

      gap: calc(18 * var(--w));
      margin-top: calc(24 * var(--w));
      perspective: 1200px;

    .card {
      position: relative;
      height: calc(390 * var(--w));
      border-radius: calc(22 * var(--w));
      transform-style: preserve-3d;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 800ms ease;

      transform: translateY(30px);

    .card.revealed {

    .card-bg {

    function makeCubicBezier(x1, y1, x2, y2) {
      const cx = 3 * x1;
      const bx = 3 * (x2 - x1) - cx;
      const ax = 1 - cx - bx;
      const cy = 3 * y1;
      const by = 3 * (y2 - y1) - cy;
      const ay = 1 - cy - by;
      function sampleX(t) { return ((ax * t + bx) * t + cx) * t; }
      function sampleY(t) { return ((ay * t + by) * t + cy) * t; }
      function sampleDerivX(t) { return (3 * ax * t + 2 * bx) * t + cx; }
      return function solve(x) {
        if (x <= 0) return 0;

        for (let i = 0; i < 8; i++) {
          const dx = sampleX(t) - x;
          if (Math.abs(dx) < 1e-5) return sampleY(t);
          const d = sampleDerivX(t);
          if (Math.abs(d) < 1e-5) break;
          t -= dx / d;
        }
        let t0 = 0, t1 = 1;
        t = x;
        while (t0 < t1) {
          const dx = sampleX(t);
          if (Math.abs(dx - x) < 1e-5) return sampleY(t);
          if (x > dx) t0 = t; else t1 = t;
          t = (t1 + t0) / 2;
        }
        return sampleY(t);
      };

      const imgData = cCtx.getImageData(0, 0, w, h);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 32;
        d[i] = Math.min(255, Math.max(0, d[i] + n));
        d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + n * 0.88));
        d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + n * 0.7));
      }
      cCtx.putImageData(imgData, 0, 0);

      // Darker cork lenticels & pores
      cCtx.fillStyle = '#654220';
      for (let i = 0; i < 400; i++) {
        const cx = Math.random() * w;
        const cy = Math.random() * h;
        const rx = 1.2 + Math.random() * 4.2;
        const ry = 0.8 + Math.random() * 2.2;
        cCtx.save();
        cCtx.translate(cx, cy);
        cCtx.rotate((Math.random() - 0.5) * 0.5);
        cCtx.beginPath();
        cCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        cCtx.fill();
        cCtx.restore();
      }

      // Lighter bark flecks
      cCtx.fillStyle = '#dbc092';
      for (let i = 0; i < 300; i++) {
        const cx = Math.random() * w;
        const cy = Math.random() * h;
        const rx = 1.0 + Math.random() * 3.2;
        const ry = 0.6 + Math.random() * 1.8;
        cCtx.beginPath();
        cCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        cCtx.fill();
      }

      const tex = new THREE.CanvasTexture(cCan);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    const corkTexture = createCorkTexture();

    // Shared Materials for Collar & Cork
    const collarMat = new THREE.MeshStandardMaterial({
      color: 0xd4a754,
      metalness: 0.94,
      roughness: 0.22,
      envMapIntensity: 2.2
    });

    const corkMat = new THREE.MeshStandardMaterial({
      map: corkTexture,
      roughness: 0.92,
      metalness: 0.02
    });

    // Camera setup
    function computeCameraD(vw, vh) {
      return Math.min(2200, Math.max(1000, 1500 * Math.min(vw / 1440, vh / 900)));
    }

    let cameraD = computeCameraD(window.innerWidth, window.innerHeight);
    let cameraFov = 2 * Math.atan((window.innerHeight / 2) / cameraD) * (180 / Math.PI);
    const camera = new THREE.PerspectiveCamera(cameraFov, window.innerWidth / window.innerHeight, 10, 4 * cameraD);
    camera.position.set(0, 0, cameraD);
    camera.lookAt(0, 0, 0);

    // Contact shadow texture
    const shadowCanvas = document.createElement('canvas');
    shadowCanvas.width = 256;
    shadowCanvas.height = 256;
    const sCtx = shadowCanvas.getContext('2d');
    const sGrad = sCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
    sGrad.addColorStop(0, 'rgba(24,14,32,.65)');
    sGrad.addColorStop(0.35, 'rgba(24,14,32,.42)');
    sGrad.addColorStop(0.7, 'rgba(24,14,32,.14)');
    sGrad.addColorStop(1, 'rgba(24,14,32,0)');
    sCtx.fillStyle = sGrad;
    sCtx.fillRect(0, 0, 256, 256);
    const shadowTexture = new THREE.CanvasTexture(shadowCanvas);
    shadowTexture.colorSpace = THREE.SRGBColorSpace;

    // Texture arrays
    const frontTextures = [];
    const backTextures = [];
    const bottlePreviews = [];

    // 3D Model Integration from "public/3d bottle main/GLB/model.glb"
    let mainBottleGeometry = null;
    let mainBottleTexture = null;
    let mainBottleMatSesame = null;
    let mainBottleMatGlass = null;
    let mainOilGeometry = null;
    let isMainModelLoaded = false;

    // Authentic Photorealistic Bottle Factory
    function createBar() {
      // 1. Inner Liquid Oil Core for Lathe Bottle (Dynamic Fluid Wave & Physical Sloshing Simulation)
      const oilMat = new THREE.MeshStandardMaterial({
        color: 0xf5b538,
        roughness: 0.10,
        metalness: 0.02,
        transparent: true,
        opacity: 0.88,
        depthWrite: true
      });
      oilMat.userData = {
        uTime: { value: 0 },
        uSloshX: { value: 0 },
        uSloshZ: { value: 0 }
      };
      oilMat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = oilMat.userData.uTime;
        shader.uniforms.uSloshX = oilMat.userData.uSloshX;
        shader.uniforms.uSloshZ = oilMat.userData.uSloshZ;
        shader.vertexShader = `
          uniform float uTime;
          uniform float uSloshX;
          uniform float uSloshZ;
        ` + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace(
          '#include <begin_vertex>',
          `
          #include <begin_vertex>
          // Fluid Wave & Physical Sloshing (Active on upper neck and shoulder)
          float fluidFactor = smoothstep(0.12, 0.375, position.y);
          if (fluidFactor > 0.001) {
            float w1 = sin(uTime * 3.2 + position.x * 28.0 + position.z * 16.0) * 0.0032;
            float w2 = cos(uTime * 2.4 - position.x * 18.0 + position.z * 24.0) * 0.0022;
            float slosh = (position.x * uSloshX + position.z * uSloshZ) * 0.40;
            transformed.y += (w1 + w2 + slosh) * fluidFactor;
          }

        );
      };
      const oilMesh = new THREE.Mesh(oilGeo, oilMat);
      oilMesh.renderOrder = 1;

      // 2. Outer Crystal Glass Bottle (Pure colorless flint glass, high transmission, brilliant specular reflections)
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transmission: 0.98,
        opacity: 1.0,
        transparent: true,
        ior: 1.51,
        thickness: 0.18,
        roughness: 0.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.02,

      });
      const glassMesh = new THREE.Mesh(glassGeo, glassMat);
      glassMesh.renderOrder = 3;

      // 3. Metallic Gold Collar Sleeve
      const collarMesh = new THREE.Mesh(collarGeo, collarMat);
      collarMesh.renderOrder = 4;

      // 4. Natural Cork Stopper
      const corkMesh = new THREE.Mesh(corkGeo, corkMat);
      corkMesh.renderOrder = 4;

      // 5. Front Luxury SRSTI Branding Sticker
      const frontMat = new THREE.MeshStandardMaterial({
        roughness: 0.82,
        metalness: 0.04,
        transparent: true,
        alphaTest: 0.01,
        side: THREE.FrontSide
      });
      const frontMesh = new THREE.Mesh(frontLabelGeom, frontMat);
      frontMesh.renderOrder = 4;

      // 6. Back Purity & Nutrition Certificate Sticker
      const backMat = new THREE.MeshStandardMaterial({
        roughness: 0.82,
        metalness: 0.04,
        transparent: true,
        alphaTest: 0.01,
        side: THREE.FrontSide
      });
      const backMesh = new THREE.Mesh(backLabelGeom, backMat);
      backMesh.renderOrder = 4;

      const latheGroup = new THREE.Group();
      latheGroup.add(oilMesh);
      latheGroup.add(glassMesh);
      latheGroup.add(collarMesh);
      latheGroup.add(corkMesh);
      latheGroup.add(frontMesh);
      latheGroup.add(backMesh);

      // 7. Subtree for "3D Bottle Main" Model (Photorealistic Baked 3D Scan with inner sloshing liquid)
      const mainBottleGroup = new THREE.Group();
      mainBottleGroup.visible = false;

      const mainOilMat = new THREE.MeshStandardMaterial({
        color: 0x382012,
        roughness: 0.10,
        metalness: 0.02,
        transparent: true,
        opacity: 0.92,
        depthWrite: true
      });
      mainOilMat.userData = {
        uTime: { value: 0 },
        uSloshX: { value: 0 },
        uSloshZ: { value: 0 }
      };
      mainOilMat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = mainOilMat.userData.uTime;
        shader.uniforms.uSloshX = mainOilMat.userData.uSloshX;
        shader.uniforms.uSloshZ = mainOilMat.userData.uSloshZ;
        shader.vertexShader = `
          uniform float uTime;
          uniform float uSloshX;
          uniform float uSloshZ;
        ` + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace(
          '#include <begin_vertex>',
          `
          #include <begin_vertex>
          float fluidFactor = smoothstep(0.12, 0.375, position.y);
          if (fluidFactor > 0.001) {
            float w1 = sin(uTime * 3.2 + position.x * 28.0 + position.z * 16.0) * 0.0032;
            float w2 = cos(uTime * 2.4 - position.x * 18.0 + position.z * 24.0) * 0.0022;
            float slosh = (position.x * uSloshX + position.z * uSloshZ) * 0.40;
            transformed.y += (w1 + w2 + slosh) * fluidFactor;
          }
          `
        );
      };
      const mainOilMesh = new THREE.Mesh(mainOilGeometry || oilGeo, mainOilMat);
      mainOilMesh.renderOrder = 1;
      mainBottleGroup.add(mainOilMesh);

      let mainMesh = null;
      if (mainBottleGeometry && mainBottleMatSesame) {
        mainMesh = new THREE.Mesh(mainBottleGeometry, mainBottleMatSesame);
        mainMesh.renderOrder = 3;
        mainBottleGroup.add(mainMesh);
      }

      const group = new THREE.Group();
      group.add(latheGroup);
      group.add(mainBottleGroup);
      scene.add(group);

      const shadowMat = new THREE.MeshBasicMaterial({
        map: shadowTexture,
        transparent: true,
        depthWrite: false,
        opacity: 0
      });
      const shadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shadowMat);
      shadowMesh.renderOrder = 0;
      scene.add(shadowMesh);

      const allMeshes = [glassMesh, oilMesh, collarMesh, corkMesh, frontMesh, backMesh];
      if (mainMesh) allMeshes.push(mainMesh);

      return {
        group,
        latheGroup,
        mainBottleGroup,
        glassMesh,
        oilMesh,
        collarMesh,
        corkMesh,
        frontMesh,
        backMesh,
        mainMesh,
        mainOilMesh,
        shadowMesh,
        glassMat,
        oilMat,
        frontMat,
        backMat,
        mainOilMat,
        shadowMat,
        allMeshes,
        flavourIndex: -1
      };
    }

    function setBarFlavour(bar, flavIdx) {
      if (bar.flavourIndex === flavIdx) return;
      bar.flavourIndex = flavIdx;
      const fl = FLAVOURS[flavIdx];
      if (!fl) return;

      const isMain = fl.bottleType === 'main' && isMainModelLoaded && bar.mainMesh;

      if (isMain) {
        bar.latheGroup.visible = false;
        bar.mainBottleGroup.visible = true;

        if (bar.mainOilMat) {
          bar.mainOilMat.color.set(fl.oilColor);
          bar.mainOilMat.opacity = fl.oilOpacity;
          bar.mainOilMat.needsUpdate = true;
        }

        if (flavIdx === 3) {
          // Black Sesame: Authentic Photorealistic Model with baked label, cork, and dark amber glass
          bar.mainMesh.material = mainBottleMatSesame;
        } else {
          // Alternative flavours assigned to main bottle: crystal flint glass with inner liquid
          bar.mainMesh.material = mainBottleMatGlass;
        }
      } else {
        bar.latheGroup.visible = true;
        bar.mainBottleGroup.visible = false;

        if (bar.oilMat) {
          bar.oilMat.color.set(fl.oilColor);
          bar.oilMat.opacity = fl.oilOpacity;
          bar.oilMat.needsUpdate = true;
        }
        if (frontTextures[flavIdx]) {
          bar.frontMat.map = frontTextures[flavIdx];
          bar.frontMat.needsUpdate = true;
        }
        if (backTextures[flavIdx]) {
          bar.backMat.map = backTextures[flavIdx];
          bar.backMat.needsUpdate = true;
        }
      }
    }

    // Build Traveller Bar & Pool of 11 bars
    const travellerBar = createBar();
    const poolBars = [];
    for (let i = 0; i < 11; i++) {
      poolBars.push(createBar());
    }

    function attachMainModelToBars() {
      const allBars = [travellerBar, ...poolBars];
      allBars.forEach((bar) => {
        if (!bar.mainMesh && mainBottleGeometry && mainBottleMatSesame) {
          bar.mainMesh = new THREE.Mesh(mainBottleGeometry, mainBottleMatSesame);
          bar.mainMesh.renderOrder = 3;
          bar.mainBottleGroup.add(bar.mainMesh);
          if (!bar.allMeshes.includes(bar.mainMesh)) {
            bar.allMeshes.push(bar.mainMesh);
          }
          if (bar.mainOilMesh && mainOilGeometry) {
            bar.mainOilMesh.geometry = mainOilGeometry;
          }
        }
        // Force refresh current flavour state on bar
        const curIdx = bar.flavourIndex;
        bar.flavourIndex = -1;
        setBarFlavour(bar, curIdx >= 0 ? curIdx : 0);
      });
    }

    // Asynchronously preload the 3D bottle model from "public/3d bottle main/GLB/model.glb"
    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      '/3d%20bottle%20main/GLB/model.glb',
      (gltf) => {
        let sourceMesh = null;
        gltf.scene.traverse((child) => {
          if (child.isMesh && !sourceMesh) {
            sourceMesh = child;
          }
        });

        if (sourceMesh) {
          // Normalize geometry bounds to exact 0.966 height and Y bounds [-0.460, 0.506]
          const geom = sourceMesh.geometry.clone();
          geom.computeBoundingBox();
          const box = geom.boundingBox;
          const sizeY = box.max.y - box.min.y;
          const centerX = (box.max.x + box.min.x) / 2;
          const centerY = (box.max.y + box.min.y) / 2;
          const centerZ = (box.max.z + box.min.z) / 2;
          geom.translate(-centerX, -centerY, -centerZ);

          const targetH = 0.966;
          const scale = targetH / sizeY;
          geom.scale(scale, scale, scale);
          geom.translate(0, 0.023, 0); // Exact bottom alignment at Y = -0.460
          geom.computeVertexNormals();
          mainBottleGeometry = geom;

          // Inner liquid geometry scaled to fit snugly inside mainBottleGeometry
          mainOilGeometry = oilGeo.clone();
          mainOilGeometry.scale(1.08, 1.0, 1.08);
          mainOilGeometry.computeVertexNormals();

          // High-resolution baked texture
          mainBottleTexture = sourceMesh.material.map;
          if (mainBottleTexture) {
            mainBottleTexture.colorSpace = THREE.SRGBColorSpace;
            mainBottleTexture.anisotropy = 8;
          }

          // Luxury physical glass material for Black Sesame Oil
          mainBottleMatSesame = new THREE.MeshPhysicalMaterial({
            map: mainBottleTexture,
            roughness: 0.16,
            metalness: 0.04,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05,
            envMapIntensity: 2.4,
            transmission: 0.28,
            transparent: true,
            opacity: 0.96,
            ior: 1.52,
            side: THREE.FrontSide
          });

          // Flint crystal glass material for any alternate products using main geometry
          mainBottleMatGlass = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transmission: 0.97,
            opacity: 1.0,
            transparent: true,
            ior: 1.51,
            thickness: 0.20,
            roughness: 0.02,
            clearcoat: 1.0,
            clearcoatRoughness: 0.02,
            envMapIntensity: 2.2,
            depthWrite: false,
            side: THREE.FrontSide
          });

          isMainModelLoaded = true;
          attachMainModelToBars();
        }
      },
      undefined,
      (err) => {
        console.warn('Could not load 3d bottle main GLB, using fallback lathe bottle:', err);
      }
    );

    function applyBarState(bar, S) {
      if (S.op <= 0.01) {
        bar.group.visible = false;
        bar.shadowMesh.visible = false;
        return;
      }
      bar.group.visible = true;
      bar.shadowMesh.visible = true;

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const bx = S.x - vw / 2;
      const by = vh / 2 - S.y;
      const bz = S.z || 0;
      bar.group.position.set(bx, by, bz);

      const sx = S.sx !== undefined ? S.sx : 1;
      const sy = S.sy !== undefined ? S.sy : 1;
      bar.group.scale.set(S.h * sx, S.h * sy, S.h);

      bar.group.rotation.order = 'ZYX';
      const rxRad = (S.rx || 0) * Math.PI / 180;
      const ryRad = (S.ry || 0) * Math.PI / 180;
      const rzRad = -(S.rz || 0) * Math.PI / 180;
      bar.group.rotation.set(rxRad, ryRad, rzRad);

      bar.glassMat.opacity = S.op;
      bar.oilMat.opacity = S.op;
      bar.frontMat.opacity = S.op;
      bar.backMat.opacity = S.op;

      if (bar.mainBottleGroup && bar.mainBottleGroup.visible) {
        if (bar.mainMesh && bar.mainMesh.material) {
          bar.mainMesh.material.opacity = S.op;
        }
        if (bar.mainOilMat) {
          bar.mainOilMat.opacity = S.op;
        }
      }

      // Contact shadow placed under base at by - 0.5 * S.h
      const shadowY = by - 0.5 * S.h + 2;
      bar.shadowMesh.position.set(bx, shadowY, bz - 0.02 * S.h);
      bar.shadowMesh.rotation.set(-Math.PI / 2, 0, rzRad);
      const shadowR = 0.46 * S.h * Math.max(0.65, Math.abs(Math.cos(ryRad)));
      bar.shadowMesh.scale.set(shadowR, shadowR * 0.72, 1);
      const shadowFac = S.shadow !== undefined ? S.shadow : 1;
      bar.shadowMat.opacity = 0.65 * S.op * shadowFac;
    }

    // Arc Slots definition: Grand Showcasing Hierarchy with centered hero prominence
    const ARC_SLOTS = [
      { k: 0, dx: 0, dy: 0, h: 485, rz: 0, ry: 0 },
      { k: 1, dx: 232, dy: 38, h: 330, rz: 6, ry: 22 },
      { k: 2, dx: 432, dy: 72, h: 285, rz: 12, ry: 36 },
      { k: 3, dx: 622, dy: 110, h: 245, rz: 18, ry: 48 },
      { k: 4, dx: 802, dy: 150, h: 210, rz: 24, ry: 58 }
    ];

    function getArcSlotState(k, u, xSpread, cx, cy, j, now, reduced) {
      const ak = Math.min(Math.abs(k), 4);
      const sign = k >= 0 ? 1 : -1;

      const i0 = Math.floor(ak);
      const i1 = Math.min(i0 + 1, 4);
      const frac = ak - i0;

      const s0 = ARC_SLOTS[i0];
      const s1 = ARC_SLOTS[i1];

      const dxVal = (s0.dx + (s1.dx - s0.dx) * frac) * sign * xSpread * u;
      const dyVal = (s0.dy + (s1.dy - s0.dy) * frac) * u;
      const hVal = (s0.h + (s1.h - s0.h) * frac) * u;
      const rzVal = (s0.rz + (s1.rz - s0.rz) * frac) * sign;
      const ryVal = (s0.ry + (s1.ry - s0.ry) * frac) * sign;

      // Optical depth: center bottle stands proud in the spotlight (+55u), flankers step back
      const zVal = (55 - ak * 65) * u;

      // Atmospheric soft focus on distant flankers, locking 100% visual emphasis on the center hero bottle
      let op = 1;
      if (ak > 0.35) {
        op = Math.max(0, 1 - (ak - 0.35) * 0.22);
        if (ak > 3.0) {
          op = ak >= 3.8 ? 0 : op * (3.8 - ak) / 0.8;
        }
      }

      // Dynamic breathing levitation & specular glint tilt on center bottle
      let idleY = 0;
      let idleRz = 0;
      let idleRy = 0;
      if (!reduced) {
        const centerWeight = Math.max(0, 1 - ak * 1.6);
        const b = Math.sin((now / 4000) * 2 * Math.PI + 1.37 * j);
        idleY = -(0.5 * b + 0.5) * (7 + 9 * centerWeight) * u;
        idleRz = 0.35 * b * (1 - centerWeight * 0.5);
        idleRy = Math.sin(now * 0.0015) * 4.5 * centerWeight;
      }

      return {
        x: cx + dxVal,
        y: cy + dyVal + idleY,
        h: hVal,
        rz: rzVal + idleRz,
        ry: ryVal + idleRy,
        rx: 0,
        z: zVal,
        op,
        sx: 1,
        sy: 1,
        shadow: 1 + 0.35 * Math.max(0, 1 - ak)
      };
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function lerpState(A, B, t) {
      return {
        x: lerp(A.x, B.x, t),
        y: lerp(A.y, B.y, t),
        h: lerp(A.h, B.h, t),
        rz: lerp(A.rz, B.rz, t),
        ry: lerp(A.ry, B.ry, t),
        rx: lerp(A.rx || 0, B.rx || 0, t),
        z: lerp(A.z || 0, B.z || 0, t),
        op: lerp(A.op, B.op, t),
        sx: lerp(A.sx !== undefined ? A.sx : 1, B.sx !== undefined ? B.sx : 1, t),
        sy: lerp(A.sy !== undefined ? A.sy : 1, B.sy !== undefined ? B.sy : 1, t),
        shadow: lerp(A.shadow !== undefined ? A.shadow : 1, B.shadow !== undefined ? B.shadow : 1, t)
      };
    }

    function easeInOutHermite(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    // Botanical Engravings for the 5 Oil Variants (Exquisite vintage copperplate etching style)
    function drawBotanicalIllustration(ctx, flavId, cx, cy) {
      ctx.save();
      ctx.translate(cx, cy);

      const inkColor = '#46382b';
      const goldAccent = '#c5a059';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (flavId === 0) {
        // Authentic Saurashtra Groundnut Pod Cluster & Foliage
        ctx.strokeStyle = inkColor;
        ctx.lineWidth = 2.2;
        ctx.fillStyle = '#f6f1e8';

        // Stems & Pinnate Foliage
        const leaves = [
          [-52, -50, -0.65, 14, 28],
          [-22, -80, -0.25, 15, 32],
          [22, -80, 0.25, 15, 32],
          [52, -50, 0.65, 14, 28]
        ];
        leaves.forEach(([lx, ly, rot, rx, ry]) => {
          ctx.save();
          ctx.translate(lx, ly);
          ctx.rotate(rot);
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          // Midrib
          ctx.beginPath();
          ctx.moveTo(0, ry);
          ctx.lineTo(0, -ry);
          ctx.stroke();
          // Lateral vein crosshatching
          ctx.lineWidth = 1.0;
          for (let vy = -ry + 8; vy < ry - 6; vy += 7) {
            ctx.beginPath();
            ctx.moveTo(0, vy);
            ctx.lineTo(rx * 0.75, vy - 5);
            ctx.moveTo(0, vy);
            ctx.lineTo(-rx * 0.75, vy - 5);
            ctx.stroke();
          }
          ctx.restore();
        });

        // Connecting stalk
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(0, -70);
        ctx.quadraticCurveTo(0, -20, -10, 0);
        ctx.stroke();

        // Peanut Pod 1 (Back Left)
        ctx.save();
        ctx.translate(-26, 12);
        ctx.rotate(-0.35);
        ctx.beginPath();
        ctx.ellipse(0, -20, 20, 16, 0, 0, Math.PI * 2);
        ctx.ellipse(0, 20, 22, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Reticulated shell mesh
        ctx.strokeStyle = goldAccent;
        ctx.lineWidth = 1.2;
        for (let r = -30; r <= 32; r += 9) {
          ctx.beginPath();
          ctx.moveTo(-16, r);
          ctx.lineTo(16, r);
          ctx.stroke();
        }
        ctx.restore();

        // Peanut Pod 2 (Front Right, slightly overlapping)
        ctx.save();
        ctx.translate(22, 18);
        ctx.rotate(0.38);
        ctx.strokeStyle = inkColor;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.ellipse(0, -22, 22, 17, 0, 0, Math.PI * 2);
        ctx.ellipse(0, 22, 24, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Shell mesh lines
        ctx.strokeStyle = goldAccent;
        ctx.lineWidth = 1.2;
        for (let r = -34; r <= 34; r += 9) {
          ctx.beginPath();
          ctx.moveTo(-18, r);
          ctx.lineTo(18, r);
          ctx.stroke();
        }
        ctx.restore();

        // Peanut Pod 3 (Foreground Center)
        ctx.save();
        ctx.translate(-2, 36);
        ctx.rotate(0.05);
        ctx.strokeStyle = inkColor;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.ellipse(0, -18, 19, 15, 0, 0, Math.PI * 2);
        ctx.ellipse(0, 18, 20, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = goldAccent;
        ctx.lineWidth = 1.2;
        for (let r = -28; r <= 28; r += 8) {
          ctx.beginPath();
          ctx.moveTo(-14, r);
          ctx.lineTo(14, r);
          ctx.stroke();
        }
        ctx.restore();

      } else if (flavId === 1) {
        // Coastal Coconut Palm (Minimalist botanical silhouette)
        ctx.strokeStyle = '#3e5c4e';
        ctx.fillStyle = '#f7faf8';
        ctx.lineWidth = 2.4;

        // Trunk with ring segments
        ctx.beginPath();
        ctx.moveTo(12, 85);
        ctx.quadraticCurveTo(8, 0, 0, -45);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-12, 85);
        ctx.quadraticCurveTo(-8, 0, 0, -45);
        ctx.stroke();

        ctx.strokeStyle = goldAccent;
        ctx.lineWidth = 1.4;
        for (let ty = 75; ty > -40; ty -= 12) {
          ctx.beginPath();
          ctx.moveTo(-10 + (75 - ty) * 0.08, ty);
          ctx.lineTo(10 - (75 - ty) * 0.08, ty);
          ctx.stroke();
        }

        // Coconuts cluster at crown
        ctx.strokeStyle = '#3e5c4e';
        ctx.fillStyle = '#e8efe9';
        ctx.lineWidth = 2.0;
        [[-8, -42], [8, -42], [0, -34]].forEach(([cx, cy]) => {
          ctx.beginPath();
          ctx.arc(cx, cy, 9, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });

        // Arching Pinnate Palm Fronds
        ctx.strokeStyle = '#3e5c4e';
        ctx.lineWidth = 2.2;
        [-0.85, -0.45, 0, 0.45, 0.85].forEach(ang => {
          ctx.save();
          ctx.translate(0, -46);
          ctx.rotate(ang);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(20, -45, 0, -85);
          ctx.stroke();
          ctx.lineWidth = 1.2;
          for (let f = 12; f < 80; f += 8) {
            ctx.beginPath();
            ctx.moveTo(0, -f);
            ctx.lineTo(18, -f - 7);
            ctx.moveTo(0, -f);
            ctx.lineTo(-18, -f - 7);
            ctx.stroke();
          }
          ctx.restore();
        });

      } else if (flavId === 2) {
        // Yellow Mustard Blossom & Silique Pods
        ctx.strokeStyle = '#a66b12';
        ctx.lineWidth = 2.2;

        ctx.beginPath();
        ctx.moveTo(0, 85);
        ctx.quadraticCurveTo(-8, 15, 0, -75);
        ctx.stroke();

        // 4-Petal Cruciform Flowers
        [[-26, -25], [26, -42], [0, -75], [-18, 30]].forEach(([fx, fy]) => {
          ctx.save();
          ctx.translate(fx, fy);
          ctx.fillStyle = '#fce588';
          ctx.strokeStyle = '#a66b12';
          ctx.lineWidth = 1.6;
          for (let p = 0; p < 4; p++) {
            ctx.rotate(Math.PI / 2);
            ctx.beginPath();
            ctx.ellipse(0, 10, 6.5, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = '#7a4e0c';
          ctx.fill();
          ctx.restore();
        });

        // Slender Mustard Silique Pods
        ctx.strokeStyle = goldAccent;
        ctx.lineWidth = 2.0;
        [[18, 12, 0.45], [-20, -2, -0.55], [22, -55, 0.35]].forEach(([px, py, prot]) => {
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(prot);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(9, -28, 2, -52);
          ctx.stroke();
          ctx.restore();
        });

      } else if (flavId === 3) {
        // Black Sesame Pod & Flowing Seeds
        ctx.strokeStyle = '#382a20';
        ctx.lineWidth = 2.2;

        ctx.beginPath();
        ctx.moveTo(0, 85);
        ctx.lineTo(0, -75);
        ctx.stroke();

        [[-20, 25, -0.38], [20, -12, 0.38], [-18, -45, -0.3]].forEach(([px, py, prot]) => {
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(prot);
          ctx.fillStyle = '#ede5dc';
          ctx.beginPath();
          ctx.ellipse(0, 0, 11, 24, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, -24);
          ctx.lineTo(0, 24);
          ctx.stroke();
          ctx.restore();
        });

        // Cascading sesame seeds
        ctx.fillStyle = '#261a12';
        [[-10, 60], [8, 48], [-6, 36], [16, 26], [4, 12], [-12, -4]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.ellipse(sx, sy, 4.5, 7, 0.3, 0, Math.PI * 2);
          ctx.fill();
        });

      } else {
        // A2 Gir Cow Bilona Clay Churning Pot & Swirls
        ctx.strokeStyle = '#c59424';
        ctx.fillStyle = '#faefd6';
        ctx.lineWidth = 2.4;

        ctx.beginPath();
        ctx.arc(0, 22, 38, 0, Math.PI);
        ctx.quadraticCurveTo(38, 0, 22, -12);
        ctx.lineTo(-22, -12);
        ctx.quadraticCurveTo(-38, 0, -38, 22);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Wooden Madhani Churner
        ctx.strokeStyle = '#8a6212';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(0, 32);
        ctx.lineTo(0, -70);
        ctx.stroke();

        ctx.strokeStyle = goldAccent;
        ctx.lineWidth = 1.6;
        for (let r = 0; r < 8; r++) {
          const ang = (r * Math.PI) / 8 + Math.PI / 16;
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * 46, Math.sin(ang) * 46 - 22);
          ctx.lineTo(Math.cos(ang) * 64, Math.sin(ang) * 64 - 22);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

      bgGrad.addColorStop(0, '#fbf8f2');
      bgGrad.addColorStop(0.5, '#f4ece2');
      bgGrad.addColorStop(1, '#ede5d8');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Fine organic paper grain
      ctx.fillStyle = 'rgba(150, 130, 100, 0.035)';

      // Debossed Antique Gold Foil Double Border
      const pad = 44;
      const innerPad = 52;

      ctx.lineWidth = 1.2;
      ctx.strokeRect(innerPad, innerPad, w - innerPad * 2, h - innerPad * 2);

        [w - innerPad, innerPad],
        [innerPad, h - innerPad],
        [w - innerPad, h - innerPad]

      ctx.fillStyle = '#c5a059';

    // Load textures and 3D geometries
    async function loadAssetsAndBuildTextures() {
      // 1. Await fonts
      await Promise.all([
        document.fonts.load('400 16px "EB Garamond"'),
        document.fonts.load('400 16px "EB Garamond"'),
        document.fonts.load('500 16px "EB Garamond"'),
        document.fonts.load('700 16px "EB Garamond"')

      for (let i = 0; i < 5; i++) {
        const fl = FLAVOURS[i];

        // Front branding canvas texture
        const fCan = createFrontLabelCanvas(fl);
        const fTex = new THREE.CanvasTexture(fCan);
        fTex.colorSpace = THREE.SRGBColorSpace;
        fTex.anisotropy = 8;

        const bCan = createBackLabelCanvas(fl);

        pCtx.fillStyle = oilGrad;
        pCtx.beginPath();

        pCtx.lineTo(114, 96);
        pCtx.quadraticCurveTo(150, 102, 186, 96);

        pCtx.beginPath();
        pCtx.moveTo(46, 642);

    // Measure Title text
    const measCanvas = document.createElement('canvas');
    const measCtx = measCanvas.getContext('2d');

    function updateTitleSize(name) {
      measCtx.font = '400 100px "EB Garamond"';
      const w = measCtx.measureText(name).width || 1;
      const isPhone = window.innerWidth < 820;
      const titleEl = document.getElementById('title');
      if (!titleEl) return;

      if (!isPhone) {
        // min(96u, 760u * 100 / w)
        const u = Math.min(window.innerWidth / 1440, window.innerHeight / 900);
        const sz = Math.min(96 * u, (760 * u * 100) / w);
        titleEl.style.fontSize = `${sz}px`;
      } else {
        // min(clamp(40px, 12.5vw, 64px), (vw - 36) * 100 / longestWordW)
        const longestWord = name.split(' ').reduce((a, b) => a.length >= b.length ? a : b, '');
        const lw = measCtx.measureText(longestWord).width || 1;
        const clampV = Math.max(40, Math.min(64, window.innerWidth * 0.125));
        const sz = Math.min(clampV, ((window.innerWidth - 36) * 100) / lw);
        titleEl.style.fontSize = `${sz}px`;
      }
    }

    function renderTitleDOM(name) {
      const titleEl = document.getElementById('title');
      if (!titleEl) return;
      const words = name.split(' ');
      titleEl.innerHTML = words.map(w => `<span class="word">${w.split('').map(c => `<span class="char">${c}</span>`).join('')}</span>`).join('<span class="word-sep"> </span>');
      updateTitleSize(name);
    }

    // Section 2 Storm Sprites setup (20 pieces)

    function updateFloatingBitsForFlavour(flavIdx) {

    updateFloatingBitsForFlavour(activeFlavour);

    // Fly to cart animation
    function flyToCart(srcElement, onComplete) {
      if (prefersReducedMotion) {
        if (onComplete) onComplete();
        return;
      }

      if (!basketChip) { if (onComplete) onComplete(); return; }
      const srcRect = srcElement.getBoundingClientRect();
      const bRect = basketChip.getBoundingClientRect();
      const bx = bRect.left + bRect.width / 2;
      const by = bRect.top + bRect.height / 2;
      const sx = srcRect.left + srcRect.width / 2;
      const sy = srcRect.top + srcRect.height / 2;
      const dx = bx - sx;
      const dy = by - sy;

      const clone = document.createElement('div');
      clone.className = 'spr';
      clone.style.position = 'fixed';
      clone.style.left = `${srcRect.left}px`;
      clone.style.top = `${srcRect.top}px`;
      clone.style.width = `${srcRect.width}px`;
      clone.style.height = `${srcRect.height}px`;
      clone.style.backgroundImage = window.getComputedStyle(srcElement).backgroundImage;
      clone.style.backgroundRepeat = 'no-repeat';
      clone.style.backgroundSize = window.getComputedStyle(srcElement).backgroundSize;
      clone.style.backgroundPosition = window.getComputedStyle(srcElement).backgroundPosition;
      clone.style.zIndex = '70';
      clone.style.pointerEvents = 'none';
      clone.style.filter = 'drop-shadow(0 10px 14px rgba(0,0,0,.25))';
      document.body.appendChild(clone);

      const startTime = performance.now();
      const flyEase = makeCubicBezier(0.5, 0, 0.2, 1);
      const lift = Math.min(160, 0.35 * Math.abs(dy) + 60);
      const k = Math.min(0.2, 30 / srcRect.height);

      function step(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / 900);
        const e = flyEase(t);

        let curX, curY, curScale, curRot, curOp;
        if (e < 0.45) {
          const u = e / 0.45;
          curX = dx * 0.4 * u;
          curY = dy * 0.4 * u - lift * Math.sin(Math.PI * u);
          curScale = 1 + (0.45 + k - 1) * u;
          curRot = -10 * u;
          curOp = 1;
        } else {
          const u = (e - 0.45) / 0.55;
          curX = dx * 0.4 + (dx - dx * 0.4) * u;
          curY = (dy * 0.4 - lift * Math.sin(Math.PI)) + (dy - (dy * 0.4 - lift * Math.sin(Math.PI))) * u;
          curScale = (0.45 + k) + (k - (0.45 + k)) * u;
          curRot = -10 + (-18 - (-10)) * u;
          curOp = 1 + (0.15 - 1) * u;
        }

        clone.style.transform = `translate(${curX}px, ${curY}px) scale(${curScale}) rotate(${curRot}deg)`;
        clone.style.opacity = curOp;

        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          clone.remove();
          if (basketChip) {
            basketChip.animate([
              { transform: 'scale(1)' },
              { transform: 'scale(1.18)' },
              { transform: 'scale(1)' }
            ], { duration: 320, easing: 'ease' });
          }
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(step);
    }

    function bumpCartCount(increment = 1) {
      currentCartCount += increment;
      if (cartBadge) {
        cartBadge.textContent = currentCartCount;
        cartBadge.classList.add('show');
        cartBadge.classList.remove('pop');
        void cartBadge.offsetWidth;
        cartBadge.classList.add('pop');
      }
    }

    // Shop Card click & tilt
    const cardTilts = Array(5).fill(0).map(() => ({ x: 0, y: 0 }));
    const cardSquashes = Array(5).fill(0).map(() => ({ sx: 1, sy: 1 }));

    shopCards.forEach((card, idx) => {
      // Tilt interaction
      card.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch') return;
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        cardTilts[idx] = { x, y };
        card.style.transform = `translateY(-8px) rotateX(${-y * 12}deg) rotateY(${x * 12}deg)`;
        const cardBg = card.querySelector('.card-bg');
        if (cardBg) cardBg.style.boxShadow = '0 24px 40px -18px rgba(40,30,20,.35)';

      card.addEventListener('pointerleave', () => {

      // Squash poke and select flavour

          goTo(idx);

        const start = performance.now();
        function squashLoop(now) {
          const t = Math.min(1, (now - start) / 500);
          let sx = 1, sy = 1;
          if (t <= 0.3) {
            const u = t / 0.3;
            sx = 1 + 0.06 * u;
            sy = 1 - 0.07 * u;
          } else if (t <= 0.6) {
            const u = (t - 0.3) / 0.3;
            sx = 1.06 + (0.97 - 1.06) * u;
            sy = 0.93 + (1.04 - 0.93) * u;
          } else {
            const u = (t - 0.6) / 0.4;
            sx = 0.97 + (1 - 0.97) * u;
            sy = 1.04 + (1 - 1.04) * u;
          }
          cardSquashes[idx] = { sx, sy };
          const pk = card.querySelector('.pk');
          if (pk && !card.classList.contains('live')) {
            pk.style.transform = `translateX(-50%) translateZ(30px) scale(${sx}, ${sy})`;

          if (t < 1) requestAnimationFrame(squashLoop);
          else {
            cardSquashes[idx] = { sx: 1, sy: 1 };
            if (pk && !card.classList.contains('live')) pk.style.transform = 'translateX(-50%) translateZ(30px)';

        }
        requestAnimationFrame(squashLoop);

      const addBtn = card.querySelector('.card-add');
      addBtn.addEventListener('click', (e) => {

    // Flavour change tweening
    let isTweening = false;
    let tweenStartPos = 0;
    let tweenTargetPos = 0;
    let tweenStartTime = 0;
    let tweenDuration = 650;
    let revealTriggered = false;
    let revealStartTime = 0;
    const revealDuration = 420;
    let isRevealing = false;
    let revealTargetFlavour = 1;

    function goTo(newTarget) {
      if (newTarget === target && !isTweening) return;
      lastInteractionTime = performance.now();
      const prevTarget = target;
      target = newTarget;
      tweenStartPos = pos;
      tweenTargetPos = target;
      tweenStartTime = performance.now();
      const dist = Math.abs(tweenTargetPos - tweenStartPos);
      tweenDuration = Math.max(380, 650 + 160 * Math.max(0, dist - 1));
      isTweening = true;
      revealTriggered = false;

      const newFlavIdx = ((target % 5) + 5) % 5;
      const prevFlavIdx = ((prevTarget % 5) + 5) % 5;

      if (prefersReducedMotion) {
        pos = target;
        isTweening = false;
        finishFlavourSwap(newFlavIdx, target > prevTarget);
        return;
      }
    }

    function finishFlavourSwap(newFlavIdx, isForward) {
      activeFlavour = newFlavIdx;
      const fl = FLAVOURS[newFlavIdx];
      document.documentElement.style.setProperty('--flav', fl.color);
      document.documentElement.style.setProperty('--rv', 'transparent');
      document.documentElement.style.setProperty('--g', fl.color + 'b8');
      revealEl.style.webkitMaskImage = '';
      revealEl.style.maskImage = '';
      isRevealing = false;

      // Update shop live card
      shopCards.forEach((c, idx) => {
        if (idx === newFlavIdx) c.classList.add('live');
        else c.classList.remove('live');
      });

      // Update 3D botanical floating bits
      updateFloatingBitsForFlavour(newFlavIdx);

      // Section 2 headline if on step 3
      if (currentStep === 3) {
        inHead.style.transition = 'transform 240ms cubic-bezier(.5,0,.75,0), opacity 240ms cubic-bezier(.5,0,.75,0)';
        inHead.style.transform = 'translateY(-10px)';

            inHead.style.transform = 'translateY(0)';
            inHead.style.opacity = '1';
          });
        }, 280);
      }
    }

    function triggerColourReveal(newFlavIdx, isForward) {
      revealTriggered = true;
      isRevealing = true;
      revealStartTime = performance.now();
      revealTargetFlavour = newFlavIdx;

    function animateTitleLetters(newName, isForward) {
      const oldChars = titleEl.querySelectorAll('.char');
      const dir = isForward ? -1 : 1;

      oldChars.forEach((ch, idx) => {
        ch.style.transition = `transform 300ms cubic-bezier(.45,0,.75,.3) ${idx * 11}ms, opacity 300ms cubic-bezier(.45,0,.75,.3) ${idx * 11}ms`;
        ch.style.transform = `translateY(${dir * 110}%)`;
        ch.style.opacity = '0';

      setTimeout(() => {
        renderTitleDOM(newName);
        const newChars = titleEl.querySelectorAll('.char');
        newChars.forEach((ch, idx) => {
          ch.style.transform = `translateY(${-dir * 110}%)`;
          ch.style.opacity = '0';
          ch.style.transition = 'none';
        });

        requestAnimationFrame(() => {
          newChars.forEach((ch, idx) => {
            ch.style.transition = `transform 620ms cubic-bezier(.22,1,.36,1) ${120 + idx * 22}ms, opacity 620ms cubic-bezier(.22,1,.36,1) ${120 + idx * 22}ms`;

            ch.style.opacity = '1';
