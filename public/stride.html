    function animateCounter(newCount) {
      countEl.style.transition = 'translate 220ms cubic-bezier(.5,0,.75,0), opacity 220ms cubic-bezier(.5,0,.75,0)';
      countEl.style.translate = '0 -10px';
      countEl.style.opacity = '0';

      setTimeout(() => {
        countEl.textContent = newCount;
        countEl.style.transition = 'none';
        countEl.style.translate = '0 14px';
        requestAnimationFrame(() => {
          countEl.style.transition = 'translate 380ms cubic-bezier(.22,1,.36,1), opacity 380ms cubic-bezier(.22,1,.36,1)';
          countEl.style.translate = '0 0';
          countEl.style.opacity = '1';
        });
      }, 280);
    }

    // Pointer Dragging on Hero Arc
    let isDragging = false;
    let dragStartX = 0;
    let dragStartPos = 0;
    let dragVelocity = 0;
    let lastDragX = 0;
    let lastDragTime = 0;

    arcHit.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary) return;
      dragStartX = e.clientX;
      lastDragX = e.clientX;
      dragStartPos = pos;
      lastDragTime = performance.now();
      dragVelocity = 0;
      isDragging = false;
    });

    window.addEventListener('pointermove', (e) => {
      if (!e.isPrimary) return;
      if (dragStartX === 0 && !isDragging) return;

      const dx = e.clientX - dragStartX;
      if (!isDragging && Math.abs(dx) > 6) {
        isDragging = true;
        isTweening = false;
        arcHit.setPointerCapture(e.pointerId);
        document.body.classList.add('dragging');
      }

      if (isDragging) {
        lastInteractionTime = performance.now();
        const dt = Math.max(1, performance.now() - lastDragTime);
        const curDx = e.clientX - lastDragX;
        const u = window.innerWidth < 820 ? Math.min(window.innerWidth / 560, window.innerHeight / 980) : Math.min(window.innerWidth / 1440, window.innerHeight / 900);
        const xSpread = window.innerWidth < 820 ? 1.02 : 1.0;
        const slotPx = 245 * u * xSpread;

        const vInstant = -(curDx / slotPx) / dt;
        dragVelocity = dragVelocity * 0.6 + vInstant * 0.4;

        pos = dragStartPos - dx / slotPx;
        lastDragX = e.clientX;
        lastDragTime = performance.now();
      }
    });

    function handlePointerUpOrCancel(e) {
      if (!isDragging) {
        dragStartX = 0;
        return;
      }
      isDragging = false;
      document.body.classList.remove('dragging');
      if (arcHit.hasPointerCapture(e.pointerId)) {
        arcHit.releasePointerCapture(e.pointerId);
      }
      dragStartX = 0;

      const flick = Math.max(-2, Math.min(2, dragVelocity * 220));
      const targetSnap = Math.round(pos + flick);
      goTo(targetSnap);
    }

    window.addEventListener('pointerup', handlePointerUpOrCancel);
    window.addEventListener('pointercancel', handlePointerUpOrCancel);

    // Raycast on click or hover
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2();

    arcHit.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouseNDC, camera);

      const meshes = [];
      poolBars.forEach(b => { if (b.group.visible && b.allMeshes) meshes.push(...b.allMeshes); });
      if (travellerBar.group.visible && travellerBar.allMeshes) meshes.push(...travellerBar.allMeshes);

      const hits = raycaster.intersectObjects(meshes);
      if (hits.length > 0) {
        const hitMesh = hits[0].object;
        let hitBarObj = null;
        if (travellerBar.allMeshes && travellerBar.allMeshes.includes(hitMesh)) {
          hitBarObj = travellerBar;
        } else {
          hitBarObj = poolBars.find(b => b.allMeshes && b.allMeshes.includes(hitMesh));
        }
        if (hitBarObj) {
          const hitIdx = hitBarObj.poolJ !== undefined ? hitBarObj.poolJ : Math.round(target);
          goTo(hitIdx);
        }
      }
    });

    arcHit.addEventListener('pointermove', (e) => {
      if (isDragging) return;
      const rect = canvas.getBoundingClientRect();
      mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouseNDC, camera);

      const meshes = [];
      poolBars.forEach(b => { if (b.group.visible && b.allMeshes) meshes.push(...b.allMeshes); });
      if (travellerBar.group.visible && travellerBar.allMeshes) meshes.push(...travellerBar.allMeshes);

      const hits = raycaster.intersectObjects(meshes);
      arcHit.style.cursor = hits.length > 0 ? 'pointer' : 'grab';
    });

    // Hero buttons & Keyboard controls
    playBtn.addEventListener('click', () => { goTo(target + 1); });

    window.addEventListener('keydown', (e) => {
      const heroRect = document.getElementById('flavors').getBoundingClientRect();
      if (heroRect.bottom > window.innerHeight * 0.5) {
        if (e.key === 'ArrowRight') goTo(target + 1);
        if (e.key === 'ArrowLeft') goTo(target - 1);
      }
    });

    // Autoplay toggle
    autoBtn.addEventListener('click', () => {
      isAutoplayOn = !isAutoplayOn;
      autoBtn.setAttribute('aria-pressed', isAutoplayOn);
      const glyphPause = autoBtn.querySelector('.glyph-pause');
      const glyphPlay = autoBtn.querySelector('.glyph-play');
      if (isAutoplayOn) {
        glyphPause.style.display = 'block';
        glyphPlay.style.display = 'none';
      } else {
        glyphPause.style.display = 'none';
        glyphPlay.style.display = 'block';
      }
    });

    // Smooth Scrolling on Desktop Wheel
    let targetScroll = window.scrollY;
    let currentScroll = window.scrollY;
    let isSmoothScrolling = false;

    window.addEventListener('wheel', (e) => {
      if (document.body.classList.contains('locked') || prefersReducedMotion) return;
      if (e.ctrlKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      e.preventDefault();
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      targetScroll = Math.max(0, Math.min(maxScroll, targetScroll + e.deltaY));
      isSmoothScrolling = true;
    }, { passive: false });

    window.addEventListener('keydown', () => { isSmoothScrolling = false; targetScroll = window.scrollY; currentScroll = window.scrollY; });
    window.addEventListener('pointerdown', (e) => {
      if (e.isPrimary) {
        isSmoothScrolling = false;
        targetScroll = window.scrollY;
        currentScroll = window.scrollY;
      }
    });

    // Section 2 Step & Flip logic
    let currentStep = 0;
    let currentFlipAngle = 0;
    let flipStartAngle = 0;
    let flipTargetAngle = 0;
    let flipStartTime = 0;
    let flipDuration = 720;
    let isFlipping = false;

    const STEP_DATA = [
      { num: "01", head: "HEIRLOOM<br>SEEDS", cap: "SINGLE-ORIGIN NON-GMO HARVEST.<br>DIRECT FROM ETHICAL FARMERS.", angle: 0 },
      { num: "02", head: "NEEM-WOOD<br>GHANI", cap: "SLOW TURNED BELOW 35°C.<br>TRUE VEDIC COLD EXTRACTION.", angle: 180 },
      { num: "03", head: "NATURAL<br>CLARITY", cap: "GRAVITY SEDIMENTATION FILTERED.<br>ZERO CHEMICALS · ZERO BLEACH.", angle: 360 },
      { num: "04", head: "", cap: "100% NABL PURITY TESTED.<br>ZERO TRANS FAT & ADULTERANTS.", angle: 720 }
    ];

    function updateStepDOM(stepIdx) {
      const data = STEP_DATA[stepIdx];
      inNum.textContent = data.num;

      if (stepIdx === 3) {
        const flName = FLAVOURS[activeFlavour].name.toUpperCase();
        const words = flName.split(' ');
        const hasLongWord = words.some(w => w.length > 9);
        inHead.innerHTML = words.join('<br>');
        inHead.style.fontSize = hasLongWord ? 'calc(88px * 0.72)' : '88px';
      } else {
        inHead.innerHTML = data.head;
        inHead.style.fontSize = '88px';
      }

      inCap.innerHTML = data.cap;

      document.querySelectorAll('.in-icon-btn').forEach((btn, idx) => {
        if (idx === stepIdx) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    function triggerStepChange(newStep) {
      if (newStep === currentStep && !isFlipping) return;
      currentStep = newStep;

      flipStartAngle = currentFlipAngle;
      flipTargetAngle = STEP_DATA[newStep].angle;
      const halfTurns = Math.abs(flipTargetAngle - flipStartAngle) / 180;
      const clampedTurns = Math.max(0.4, Math.min(2.0, halfTurns));
      flipDuration = prefersReducedMotion ? 0 : 720 * clampedTurns;
      flipStartTime = performance.now();
      isFlipping = true;

      if (prefersReducedMotion) {
        currentFlipAngle = flipTargetAngle;
        isFlipping = false;
        updateStepDOM(newStep);
        return;
      }

      // Text change at 38%
      const textSwapDelay = 0.38 * Math.min(flipDuration, 720);
      setTimeout(() => {
        // Drift up 10px and fade
        [inNum, inHead, inCap].forEach(el => {
          el.style.transform = 'translateY(-10px)';
          el.style.opacity = '0';
        });

        setTimeout(() => {
          updateStepDOM(newStep);
          [inNum, inHead, inCap].forEach(el => {
            el.style.transition = 'none';
            el.style.transform = 'translateY(14px)';
          });
          requestAnimationFrame(() => {
            [inNum, inHead, inCap].forEach(el => {
              el.style.transition = 'transform 460ms cubic-bezier(.22,1,.36,1), opacity 460ms cubic-bezier(.22,1,.36,1)';
              el.style.transform = 'translateY(0)';
              el.style.opacity = '1';
            });
          });
        }, 40);
      }, textSwapDelay);
    }

    // Step icons click
    document.querySelectorAll('.in-icon-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const step = parseInt(btn.dataset.step, 10);
        const sec = document.getElementById('inside');
        const pTarget = [0.095, 0.285, 0.475, 0.665][step];
        const secTop = sec.offsetTop;
        const secHeight = sec.offsetHeight;
        const targetY = secTop + pTarget * (secHeight - window.innerHeight);
        targetScroll = targetY;
        isSmoothScrolling = true;
      });
    });

    // Nav pill highlight position
    function updateNavHighlight(targetId) {
      const activeLink = document.querySelector(`.nav-link[data-target="${targetId}"]`);
      if (activeLink && pillHighlight && navPill) {
        navLinks.forEach(l => l.classList.remove('active'));
        activeLink.classList.add('active');
        const pillRect = navPill.getBoundingClientRect();
        const linkRect = activeLink.getBoundingClientRect();
        pillHighlight.style.left = `${linkRect.left - pillRect.left}px`;
        pillHighlight.style.width = `${linkRect.width}px`;
      }
    }

    // Section 3 Headline Reveal Observer
    const shopObs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          shopHead.classList.add('revealed');
          shopCap.classList.add('revealed');
          shopCards.forEach((c, i) => {
            setTimeout(() => c.classList.add('revealed'), i * 80);
          });
          shopObs.disconnect();
        }
      });
    }, { threshold: 0.18 });
    shopObs.observe(document.getElementById('shop'));

    // Immediate Hero Entrance (Intro animation removed)
    function enterHero() {
      if (isEntranceDone) return;
      isEntranceDone = true;
      document.body.classList.remove('locked');

      if (navEl) navEl.classList.add('entered');
      const rings = document.getElementById('rings');
      if (rings) rings.classList.add('entered');

      playBtn.classList.add('entered');
      countEl.classList.add('entered');
      autoBtn.classList.add('entered');

      // Hero bits fade & drift
      document.querySelectorAll('.hero-bit').forEach((b, idx) => {
        b.style.opacity = '1';
        if (!prefersReducedMotion) {
          b.animate([
            { transform: `translate(0, 0) rotate(${[-18, 30, 22, 12, -10][idx]}deg)` },
            { transform: `translate(${[13, 14, -14, 12, -13][idx]}px, ${-(22 + 3 * idx)}px) rotate(${[-8, 20, 32, 2, -22][idx]}deg)` },
            { transform: `translate(0, 0) rotate(${[-18, 30, 22, 12, -10][idx]}deg)` }
          ], { duration: 7000 + 900 * idx, iterations: Infinity, easing: 'ease-in-out' });
        }
      });

      // Smooth sweep from -2.6 into center carousel
      const sweepStart = performance.now();
      function sweep(now) {
        const t = Math.min(1, (now - sweepStart) / 1200);
        pos = -2.6 + (0 - (-2.6)) * entranceEase(t);
        if (t < 1) requestAnimationFrame(sweep);
        else {
          pos = 0;
          target = 0;
        }
      }
      requestAnimationFrame(sweep);
    }

    // Launch directly into Hero Section
    enterHero();

    // Phone cards strip smooth scrolling first time p3 > 0
    let phoneStripScrolled = false;

    // Window Resize Handling
    function onResize() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, vw < 820 ? 1.75 : 2));
      renderer.setSize(vw, vh);

      cameraD = computeCameraD(vw, vh);
      cameraFov = 2 * Math.atan((vh / 2) / cameraD) * (180 / Math.PI);
      camera.fov = cameraFov;
      camera.aspect = vw / vh;
      camera.position.set(0, 0, cameraD);
      camera.near = 10;
      camera.far = 4 * cameraD;
      camera.updateProjectionMatrix();

      // Section 2 Frame scale k
      const isPhone = vw < 820;
      const k = isPhone ? Math.min(vw / 390, vh / 780) : Math.min(vw / 1440, vh / 900);
      document.documentElement.style.setProperty('--frame-k', k);

      updateTitleSize(FLAVOURS[activeFlavour].name);
      updateNavHighlight(currentActiveNavTarget);
    }
    window.addEventListener('resize', onResize);

    // Main Animation Loop
    let lastFrameTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min(now - lastFrameTime, 100);
      lastFrameTime = now;

      // Smooth scroll lerp
      if (isSmoothScrolling && !prefersReducedMotion) {
        const factor = 1 - Math.exp(-dt / 120);
        currentScroll += (targetScroll - currentScroll) * factor;
        window.scrollTo(0, currentScroll);
        if (Math.abs(targetScroll - currentScroll) < 0.5) {
          currentScroll = targetScroll;
          window.scrollTo(0, currentScroll);
          isSmoothScrolling = false;
        }
      } else {
        currentScroll = window.scrollY;
        targetScroll = window.scrollY;
      }

      // Autoplay step
      const heroSec = document.getElementById('flavors');
      const heroR = heroSec.getBoundingClientRect();
      const heroVisibleFraction = Math.max(0, Math.min(heroR.bottom, window.innerHeight) - Math.max(heroR.top, 0)) / window.innerHeight;

      if (isAutoplayOn && isEntranceDone && !isDragging && !prefersReducedMotion && !document.hidden && heroVisibleFraction >= 0.6) {
        if (now - lastInteractionTime > 3200) {
          goTo(target + 1);
        }
      }

      // Slide tweening
      if (isTweening) {
        const elapsed = now - tweenStartTime;
        const p = Math.min(1, elapsed / tweenDuration);
        pos = tweenStartPos + (tweenTargetPos - tweenStartPos) * glideEase(p);

        if (p >= 0.12 && !revealTriggered) {
          const nextFlavIdx = ((tweenTargetPos % 5) + 5) % 5;
          triggerColourReveal(nextFlavIdx, tweenTargetPos > tweenStartPos);
        }

        if (p >= 1) {
          pos = tweenTargetPos;
          isTweening = false;
          if (!revealTriggered) {
            triggerColourReveal(((tweenTargetPos % 5) + 5) % 5, tweenTargetPos > tweenStartPos);
          }
        }
      }

      // Colour reveal progress
      if (isRevealing) {
        const rElapsed = now - revealStartTime;
        const rp = Math.min(1, rElapsed / revealDuration);
        const re = glideEase(rp);

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const u = vw < 820 ? Math.min(vw / 560, heroR.height / 980) : Math.min(vw / 1440, vh / 900);
        const cx = vw / 2;
        const cy = vw < 820 ? 0.40 * heroR.height : heroR.height / 2 - 78 * u;

        const maxDist = Math.max(
          Math.hypot(cx, cy),
          Math.hypot(vw - cx, cy),
          Math.hypot(cx, heroR.height - cy),
          Math.hypot(vw - cx, heroR.height - cy)
        );
        const R = 1.45 * maxDist;
        const r = R * re;
        const f = Math.max(60, 0.35 * r);

        const mask = `radial-gradient(circle at ${cx}px ${cy}px, #000 ${Math.max(0, r - f)}px, transparent ${r}px)`;
        revealEl.style.webkitMaskImage = mask;
        revealEl.style.maskImage = mask;

        if (rp >= 1) {
          finishFlavourSwap(revealTargetFlavour, true);
        }
      }

      // Section 2 Sticky tracking & step progress
      const insideSec = document.getElementById('inside');
      const inSecR = insideSec.getBoundingClientRect();
      const inSecH = insideSec.offsetHeight;
      const vh = window.innerHeight;
      const vw = window.innerWidth;

      let pinY = 0;
      if (inSecR.top > 0) pinY = inSecR.top;
      else if (inSecR.bottom < vh) pinY = inSecR.bottom - vh;
      else pinY = 0;

      if (inSecR.bottom <= 0 || inSecR.top >= vh) {
        if (inPin) inPin.style.display = 'none';
        inFront.style.display = 'none';
      } else {
        if (inPin) {
          inPin.style.display = 'block';
          inPin.style.transform = `translateY(${pinY}px)`;
        }
        inFront.style.display = 'block';
        inFront.style.transform = `translateY(${pinY}px)`;
      }

      // Section 2 scroll progress p & storm q
      const pSec = Math.max(0, Math.min(1, -inSecR.top / (inSecH - vh)));
      const stepIdx = Math.floor(Math.min(pSec, 0.759) / 0.19);
      if (stepIdx !== currentStep) {
        triggerStepChange(stepIdx);
      }

      // Flip tween
      if (isFlipping) {
        const fElapsed = now - flipStartTime;
        const fp = Math.min(1, fElapsed / flipDuration);
        const sineEase = -(Math.cos(Math.PI * fp) - 1) / 2;
        currentFlipAngle = flipStartAngle + (flipTargetAngle - flipStartAngle) * sineEase;
        if (fp >= 1) {
          currentFlipAngle = flipTargetAngle;
          isFlipping = false;
        }
      }

      // Storm q
      const stormQ = Math.max(0, Math.min(1, (pSec - 0.76) / 0.24));
      if (stormQ > 0 && stormQ < 1 && !prefersReducedMotion) {
        stormLayer.style.display = 'block';
        inDark.style.opacity = Math.min(1, 3.5 * stormQ) * 0.42;
        const frontFrameFade = 1 - Math.min(1, 4 * stormQ);
        document.getElementById('inFrontFrame').style.opacity = frontFrameFade;
        inNum.style.opacity = frontFrameFade;

        // Storm pieces
        const stormR = 0.55 * Math.hypot(vw, vh);
        const baseSz = 0.085 * Math.min(vw, vh);

        stormPieces.forEach(p => {
          const s = Math.max(0, Math.min(1, (stormQ - 0.45 * p.ph) / 0.55));
          if (s <= 0 || s >= 1) {
            p.el.style.opacity = '0';
          } else {
            const rad = (0.06 + Math.pow(s, 1.5) * 0.95) * stormR;
            const px = vw / 2 + Math.cos(p.a) * rad;
            const py = vh / 2 + Math.sin(p.a) * rad * 0.8;
            const sc = (0.2 + 1.7 * s) * p.size;
            const rot = p.spin * s;
            const op = Math.sin(Math.PI * s) * Math.min(1, 5 * stormQ) * Math.min(1, 6 * (1 - stormQ));
            p.el.style.width = `${baseSz}px`;
            p.el.style.height = `${baseSz * (p.h / p.w)}px`;
            p.el.style.transform = `translate3d(${px - baseSz / 2}px, ${py - (baseSz * (p.h / p.w)) / 2}px, 0) scale(${sc}) rotate(${rot}deg)`;
            p.el.style.opacity = op;
          }
        });
      } else {
        stormLayer.style.display = 'none';
        inDark.style.opacity = '0';
        document.getElementById('inFrontFrame').style.opacity = '1';
        if (!isFlipping) inNum.style.opacity = '1';
      }

      // Shop & Range scroll blending
      const shopSec = document.getElementById('shop');
      const shopR = shopSec.getBoundingClientRect();
      const p1 = Math.max(0, Math.min(1, 1 - inSecR.top / vh));
      const p3 = Math.max(0, Math.min(1, (vh - shopR.top) / (0.7 * vh)));

      // Phone strip scroll
      if (p3 > 0 && !phoneStripScrolled && window.innerWidth < 820) {
        phoneStripScrolled = true;
        const liveCard = shopCards[activeFlavour];
        if (liveCard) {
          liveCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      }

      // Update Nav active link & themes
      const sections = ['flavors', 'inside', 'shop'];
      let activeTarget = 'flavors';
      sections.forEach(id => {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= vh * 0.35) {
          activeTarget = id;
        }
      });

      if (activeTarget !== currentActiveNavTarget) {
        currentActiveNavTarget = activeTarget;
        updateNavHighlight(activeTarget);
      }

      // Nav style changes
      if (navEl) {
        if (activeTarget === 'shop') {
          navEl.classList.remove('dark');
          if (navPill) navPill.classList.add('light');
        } else {
          navEl.classList.remove('dark');
          if (navPill) navPill.classList.remove('light');
        }
      }

      // Compute Traveller Bar Anchors (A, B, C)
      const isPhone = vw < 820;
      const u = isPhone ? Math.min(vw / 560, heroR.height / 980) : Math.min(vw / 1440, vh / 900);
      const xSpread = isPhone ? 1.02 : 1.0;
      const cx = vw / 2;
      const cy = isPhone ? 0.40 * heroR.height : heroR.height / 2 - 78 * u;

      const jT = Math.round(target);

      // Anchor A (Hero Arc)
      const stateA = getArcSlotState(jT - pos, u, xSpread, cx, cy, jT, now, prefersReducedMotion);
      stateA.op = 1;

      // Anchor B (Section 2)
      const inBarR = inBar.getBoundingClientRect();
      const bob = prefersReducedMotion ? 0 : Math.sin((now / 2600) * 2 * Math.PI) * 6;
      const stormSpin = prefersReducedMotion ? 0 : 720 * stormQ;
      const stateB = {
        x: inBarR.left + inBarR.width / 2,
        y: inBarR.top + inBarR.height / 2 + bob,
        h: inBarR.height,
        rz: 14,
        ry: currentFlipAngle + stormSpin,
        rx: 0,
        z: 0,
        op: 1,
        sx: 1,
        sy: 1,
        shadow: 1
      };

      // Anchor C (Shop live card)
      const liveCard = shopCards[activeFlavour];
      const pkEl = liveCard.querySelector('.pk');
      const pkR = pkEl.getBoundingClientRect();
      const nearestTurn = Math.round(stateB.ry / 360) * 360;
      const tilt = cardTilts[activeFlavour] || { x: 0, y: 0 };
      const squash = cardSquashes[activeFlavour] || { sx: 1, sy: 1 };
      const stateC = {
        x: pkR.left + pkR.width / 2,
        y: pkR.top + pkR.height / 2,
        h: pkR.height,
        rz: 0,
        ry: nearestTurn + tilt.x * 14,
        rx: -tilt.y * 14,
        z: 30,
        op: 1,
        sx: squash.sx,
        sy: squash.sy,
        shadow: 0.7
      };

      // Blend A -> B -> C
      let travellerState = { ...stateA };
      if (p1 > 0) {
        travellerState = lerpState(travellerState, stateB, easeInOutHermite(p1));
      }
      if (p3 > 0) {
        travellerState = lerpState(travellerState, stateC, easeInOutHermite(p3));
      }

      setBarFlavour(travellerBar, ((jT % 5) + 5) % 5);
      applyBarState(travellerBar, travellerState);
      if (pkEl && p3 > 0) {
        pkEl.style.opacity = Math.max(0, 1 - travellerState.op);
      }

      // Real-time Fluid Sloshing Simulation across carousel motion
      const dPos = pos - (window._prevPos !== undefined ? window._prevPos : pos);
      window._prevPos = pos;
      window._sloshVel = ((window._sloshVel || 0) * 0.85) - dPos * 4.5;
      window._sloshX = (window._sloshX || 0) + (window._sloshVel - (window._sloshX || 0)) * 0.15;

      const fluidTime = now * 0.001;
      const ambientWave = Math.sin(now * 0.0024) * 0.012;
      const totalSloshX = window._sloshX + ambientWave;
      const totalSloshZ = Math.cos(now * 0.0019) * 0.01;

      // Update fluid uniforms on all bottles
      [travellerBar, ...poolBars].forEach(bar => {
        if (bar.oilMat && bar.oilMat.userData && bar.oilMat.userData.uTime) {
          bar.oilMat.userData.uTime.value = fluidTime;
          bar.oilMat.userData.uSloshX.value = totalSloshX;
          bar.oilMat.userData.uSloshZ.value = totalSloshZ;
        }
        if (bar.mainOilMat && bar.mainOilMat.userData && bar.mainOilMat.userData.uTime) {
          bar.mainOilMat.userData.uTime.value = fluidTime;
          bar.mainOilMat.userData.uSloshX.value = totalSloshX;
          bar.mainOilMat.userData.uSloshZ.value = totalSloshZ;
        }
      });

      // Render Pool bars (Hero arc in Section 1, and Live 3D bottles on Shop cards in Section 3!)
      if (p3 > 0.05) {
        // Section 3: Position pool bars on the other 4 shop cards so every card has a live 3D bottle!
        let poolCardIdx = 0;
        shopCards.forEach((c, idx) => {
          if (idx !== activeFlavour && poolCardIdx < poolBars.length) {
            const poolBar = poolBars[poolCardIdx++];
            const pk = c.querySelector('.pk');
            if (pk) {
              const r = pk.getBoundingClientRect();
              const tilt = cardTilts[idx] || { x: 0, y: 0 };
              const sq = cardSquashes[idx] || { sx: 1, sy: 1 };
              const shopBarState = {
                x: r.left + r.width / 2,
                y: r.top + r.height / 2,
                h: r.height,
                rz: 0,
                ry: tilt.x * 14,
                rx: -tilt.y * 14,
                z: 30,
                op: Math.min(1, (p3 - 0.05) / 0.35),
                sx: sq.sx,
                sy: sq.sy,
                shadow: 0.75
              };
              setBarFlavour(poolBar, idx);
              applyBarState(poolBar, shopBarState);
              // Hide 2D background image when 3D bottle is in place
              pk.style.opacity = Math.max(0, 1 - shopBarState.op);
            }
          }
        });
        // Hide remaining unused pool bars in Section 3
        for (let k = poolCardIdx; k < poolBars.length; k++) {
          poolBars[k].group.visible = false;
          poolBars[k].shadowMesh.visible = false;
        }
      } else {
        // Section 1 Hero Arc & Section 2 Transition
        const jStart = Math.floor(pos) - 5;
        let poolIdx = 0;
        for (let j = jStart; j <= jStart + 10; j++) {
          const poolBar = poolBars[poolIdx++];
          if (j === jT) {
            poolBar.group.visible = false;
            poolBar.shadowMesh.visible = false;
          } else {
            poolBar.poolJ = j;
            const k = j - pos;
            const sSlot = getArcSlotState(k, u, xSpread, cx, cy, j, now, prefersReducedMotion);
            // Others fade as p1 rises
            sSlot.op *= Math.max(0, 1 - Math.min(1.6 * p1, 1));
            setBarFlavour(poolBar, ((j % 5) + 5) % 5);
            applyBarState(poolBar, sSlot);
          }
        }
        // Restore 2D card pk opacity when leaving Section 3
        shopCards.forEach(c => {
          const pk = c.querySelector('.pk');
          if (pk) pk.style.opacity = '1';
        });
      }

      renderer.render(scene, camera);
    }

    // Initialize application
    async function init() {
      onResize();
      updateNavHighlight('flavors');
      try {
        await loadAssetsAndBuildTextures();
      } catch (err) {
        console.warn('Asset/texture load error:', err);
      }
      requestAnimationFrame(animate);
    }

    init();
  </script>
</body>
